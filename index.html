<title>Gdzie jest bus?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Doto:wght@700;900&display=swap">
<style>
/* Layout: jedna kolumna, najpierw odpowiedź dla rodzica (mój przystanek), potem cała trasa jak na słupku przystankowym. */
:root {
  --bg: #f1f3ef;
  --surface: #ffffff;
  --fg: #18201b;
  --muted: #5d685f;
  --line: #d5dad2;
  --accent: #5a2a86;
  --accent-fg: #ffffff;
  --ok: #1d7a3e;
  --ok-bg: #dff1e4;
  --warn: #8a5a00;
  --warn-bg: #fbecc8;
  --bad: #b3261e;
  --bad-bg: #f9dedc;
  --idle: #5d685f;
  --idle-bg: #e4e7e1;
  --blind-bg: #0d0f12;
  --blind-fg: #ffb000;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-blind: "Doto", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --surface: #1d2326; --fg: #e8ede9; --muted: #9aa69d; --line: #2f383b;
    --accent: #c9a2f0; --accent-fg: #1a1024;
    --ok: #6fd391; --ok-bg: #1b3526; --warn: #f0c35a; --warn-bg: #3a2f10;
    --bad: #ff9a92; --bad-bg: #44201d; --idle: #9aa69d; --idle-bg: #2a3235;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --surface: #1d2326; --fg: #e8ede9; --muted: #9aa69d; --line: #2f383b;
  --accent: #c9a2f0; --accent-fg: #1a1024;
  --ok: #6fd391; --ok-bg: #1b3526; --warn: #f0c35a; --warn-bg: #3a2f10;
  --bad: #ff9a92; --bad-bg: #44201d; --idle: #9aa69d; --idle-bg: #2a3235;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.demo { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.fail { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

/* tablica kierunku autobusu */
.blind { background: var(--blind-bg); color: var(--blind-fg); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
.blind .num { font-family: var(--font-blind); font-weight: 900; font-size: 56px; line-height: 1; letter-spacing: 2px; }
.blind .dest { font-family: var(--font-blind); font-weight: 700; font-size: 18px; line-height: 1.2; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.blind .via { font-family: var(--font-body); font-size: 13px; color: #c9b27a; margin-top: 4px; text-transform: none; }

.controls { display: grid; gap: 12px; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
select, input[type="search"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; min-width: 0; }
input[type="search"] { padding-block: 9px; }

.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.answer .k { font-size: 14px; color: var(--muted); }
.answer .big { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.answer .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.answer .sub { color: var(--muted); font-size: 15px; }
.answer a { color: var(--accent); font-weight: 700; }
.chip { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.idle { background: var(--idle-bg); color: var(--idle); }

/* trasa */
.route { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.route li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; position: relative; border-top: 1px solid var(--line); }
.route li:first-child { border-top: 0; }
.route li::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.route li:first-child::before { top: 50%; } .route li:last-child::before { bottom: 50%; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); margin-left: 2px; position: relative; z-index: 1; }
.route li.passed { color: var(--muted); }
.route li.passed .dot { background: var(--line); border-color: var(--line); }
.route li.mine { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight: 700; }
.route li .nm { overflow-wrap: anywhere; }
.route li .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.times { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; display: grid; }
.times s { color: var(--muted); font-size: 13px; text-decoration-thickness: 1px; }
.times .e.ok { color: var(--ok); font-weight: 700; } .times .e.warn { color: var(--warn); font-weight: 700; } .times .e.bad { color: var(--bad); font-weight: 700; }
.route li.bus { background: var(--accent); color: var(--accent-fg); font-weight: 700; padding-block: 8px; }
.route li.bus::before { display: none; }
.route li.bus .glyph { font-family: var(--font-blind); font-weight: 900; font-size: 18px; }

footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
footer .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
footer button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .big { transition: color .3s; } }
</style>

<div class="wrap">
  <div id="demo" class="demo" hidden></div>
  <div id="fail" class="fail" hidden></div>
  <div class="blind" aria-live="polite">
    <div class="num" id="num">159</div>
    <div class="dest"><span id="dest"></span><div class="via" id="via"></div></div>
  </div>
  <div class="controls">
    <label class="field" id="svcField"><span id="svcLabel"></span>
      <input type="search" id="svcQ" autocomplete="off" hidden>
      <select id="svcSel"></select>
    </label>
    <label class="field"><span id="stopLabel"></span><select id="stopSel"></select></label>
    <label class="field" id="runField" hidden><span id="runLabel"></span><select id="runSel"></select></label>
  </div>
  <section class="answer" id="answer" aria-live="polite"></section>
  <ol class="route" id="route"></ol>
  <footer>
    <div id="updated"></div>
    <div class="bar"><span id="source"></span><button id="langBtn" type="button">EN</button></div>
  </footer>
</div>

<script>
/* ============ USTAWIENIA ============
   API_BASE: adres Twojego Cloudflare Workera (patrz README). Puste = tryb pokazowy (symulacja).
   Rozkłady: plik services.json obok strony, tworzony skryptem tools/txc_to_json.py z plików BODS. */
const CONFIG = { API_BASE: "https://schoolbus.jakubspringer32.workers.dev", SERVICES_URL: "services.json", POLL_MS: 20000, STALE_MS: 150000 };

const I18N = {
  pl: {
    demo: "TRYB POKAZOWY: to symulacja, nie prawdziwy autobus.",
    service: "Linia", search: "Szukaj linii (numer lub nazwa)…", school: "Szkolne", regular: "Zwykłe", schoolTag: "szkolny",
    pick: "Twój przystanek", pickPh: "Wybierz przystanek…", run: "Kurs (godzina na tym przystanku)",
    willBe: "Autobus będzie na przystanku ok.", planned: "Planowo", pickHint: "Wybierz swój przystanek, a pokażę, kiedy przyjedzie autobus.",
    onTime: "Na czas", late: n => `Spóźnienie ${n} min`, early: n => `Przed czasem ${n} min`, passed: "Już przejechał",
    noBus: "Autobusu nie widać w systemie", noBusSub: "Może jeszcze nie wyjechał albo kurs dziś nie jedzie. Sprawdź ponownie za chwilę.",
    noDelay: "Pozycja nieznana, brak danych o opóźnieniu", notRunning: "Teraz nie ma kursu", notRunningSub: n => `Pierwszy przystanek tego kursu: ${n}.`,
    notToday: "Dziś ten kurs nie jedzie", nextRun: d => `Następny raz: ${d}.`,
    busNow: "Autobus jest teraz", between: (a, b) => `między: ${a} → ${b}`, atStart: s => `przed przystankiem: ${s}`, map: "Zobacz na mapie",
    here: "AUTOBUS", updated: s => `Dane sprzed ${s} s`, stale: "Brak świeżych danych z autobusu", err: "Nie można pobrać danych. Spróbuj ponownie.",
    source: "Dane: Bus Open Data Service (DfT).", loadErr: "Nie można wczytać rozkładów (services.json).", dateLoc: "pl-PL"
  },
  en: {
    demo: "DEMO MODE: this is a simulation, not a real bus.",
    service: "Service", search: "Search services (number or name)…", school: "School", regular: "Regular", schoolTag: "school",
    pick: "Your stop", pickPh: "Choose a stop…", run: "Trip (time at this stop)",
    willBe: "Bus due at your stop at about", planned: "Scheduled", pickHint: "Choose your stop and I will show when the bus arrives.",
    onTime: "On time", late: n => `${n} min late`, early: n => `${n} min early`, passed: "Already passed",
    noBus: "Bus not visible in the system", noBusSub: "It may not have left yet, or the trip is not running today. Check again shortly.",
    noDelay: "Position unknown, delay not reported", notRunning: "No trip running now", notRunningSub: n => `First stop of this trip: ${n}.`,
    notToday: "This trip does not run today", nextRun: d => `Next runs: ${d}.`,
    busNow: "Bus is now", between: (a, b) => `between: ${a} → ${b}`, atStart: s => `before: ${s}`, map: "View on map",
    here: "BUS", updated: s => `Data ${s} s old`, stale: "No fresh data from the bus", err: "Could not load data. Try again.",
    source: "Data: Bus Open Data Service (DfT).", loadErr: "Could not load timetables (services.json).", dateLoc: "en-GB"
  }
};

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const demoMode = !CONFIG.API_BASE;
const S = { lang: store.get("gb:lang") || "pl", services: [], svc: null, stop: null, tripId: null, vehicles: [], fetchedAt: null, error: false, demoT0: Date.now() };
const t = () => I18N[S.lang];
const trip = () => S.svc && S.svc.trips.find(x => x.id === S.tripId) || null;
const stopInfo = code => S.svc.stops[code] || { name: code, locality: "" };
const stopName = code => { const s = stopInfo(code); return (s.locality ? s.locality + " – " : "") + s.name; };

/* ---- czas ---- */
const hhmm = ms => new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
function schedMs(str, baseMs) { const [h, m] = str.split(":").map(Number); const d = new Date(baseMs); d.setHours(h, m, 0, 0); return d.getTime(); }
const ymd = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function nowMs() {
  const tr = trip();
  if (!demoMode || !tr) return Date.now();
  const st = tr.stops, a = schedMs(st[0][1], Date.now()) - 120000, b = schedMs(st[st.length - 1][1], Date.now()) + 120000;
  return a + (((Date.now() - S.demoT0) * 15) % (b - a)); // 15x szybciej, zapętlone
}
function runsOn(tr, ms) {
  if (demoMode) return true;
  const wd = new Date(ms).getDay() || 7, day = ymd(ms), svc = S.svc;
  if (!tr.days.includes(wd)) return false;
  if (svc.validFrom && day < svc.validFrom) return false;
  if (svc.validTo && day > svc.validTo) return false;
  if (tr.schoolDays && tr.schoolDays.length)
    return tr.schoolDays.some(ref => ((svc.orgs[ref] || {}).workingDays || []).some(([a, b]) => day >= a && day <= b));
  return true;
}
function nextRunText(tr, ms) {
  for (let i = 1; i <= 120; i++) if (runsOn(tr, ms + i * 86400000))
    return new Date(ms + i * 86400000).toLocaleDateString(t().dateLoc, { weekday: "long", day: "numeric", month: "long" });
  return null;
}

/* ---- pozycja na trasie ---- */
function project(pts, lat, lon, now) {
  const k0 = Math.cos(lat * Math.PI / 180);
  const X = p => [(p.lon - lon) * k0 * 111320, (p.lat - lat) * 110540];
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    if (now < pts[i].ms - 25 * 60000 || now > pts[i + 1].ms + 25 * 60000) continue;
    const A = X(pts[i]), B = X(pts[i + 1]), dx = B[0] - A[0], dy = B[1] - A[1], l2 = dx * dx + dy * dy;
    const f = l2 ? Math.max(0, Math.min(1, -(A[0] * dx + A[1] * dy) / l2)) : 0;
    const dist = Math.hypot(A[0] + f * dx, A[1] + f * dy);
    if (!best || dist < best.dist) best = { i, f, dist };
  }
  if (!best || best.dist > 600) return null;
  const a = pts[best.i], b = pts[best.i + 1];
  return { p: best.i + best.f, schedAt: a.ms + best.f * (b.ms - a.ms), dist: best.dist };
}

/* ---- dane na żywo ---- */
function pickVehicle(tr, now) {
  const first = schedMs(tr.stops[0][1], now);
  const ok = S.vehicles.filter(v => v.recorded && Date.now() - v.recorded < 600000 &&
    (!v.aimedDeparture || Math.abs(v.aimedDeparture - first) < 12 * 60000));
  ok.sort((a, b) => b.recorded - a.recorded);
  return ok[0] || null;
}
function demoVehicles() {
  const tr = trip(); if (!tr) return [];
  const now = nowMs(), d = Math.round(170 + 50 * Math.sin(now / 240000)) * 1000;
  const pts = tr.stops.map(([a, tm]) => ({ ...stopInfo(a), ms: schedMs(tm, now) }));
  const at = Math.max(pts[0].ms, Math.min(pts[pts.length - 1].ms, now - d));
  let i = 0; while (i < pts.length - 2 && at > pts[i + 1].ms) i++;
  const f = pts[i + 1].ms > pts[i].ms ? (at - pts[i].ms) / (pts[i + 1].ms - pts[i].ms) : 0;
  return [{ id: "DEMO", lat: pts[i].lat + f * (pts[i + 1].lat - pts[i].lat), lon: pts[i].lon + f * (pts[i + 1].lon - pts[i].lon),
            delaySec: null, recorded: Date.now(), posTime: now, aimedDeparture: null }];
}
async function poll() {
  if (!S.svc) return;
  if (demoMode) { S.vehicles = demoVehicles(); S.fetchedAt = Date.now(); renderLive(); return; }
  try {
    const sv = S.svc, q = `line=${encodeURIComponent(sv.line)}&operator=${encodeURIComponent(sv.operator.noc || "")}&bbox=${sv.bbox || ""}`;
    const res = await fetch(`${CONFIG.API_BASE}/api/vehicles?${q}`);
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    S.vehicles = (j.vehicles || []).map(v => ({ ...v, posTime: v.recorded }));
    S.fetchedAt = Date.now(); S.error = false;
  } catch (e) { S.error = true; }
  renderLive();
}

/* ---- logika statusu ---- */
function analyse(now) {
  const tr = trip();
  const pts = tr.stops.map(([a, tm]) => ({ a, ...stopInfo(a), ms: schedMs(tm, now) }));
  const first = pts[0].ms, last = pts[pts.length - 1].ms;
  const runs = runsOn(tr, now), inWindow = runs && now > first - 25 * 60000 && now < last + 15 * 60000;
  const v = inWindow ? pickVehicle(tr, now) : null;
  let prog = null, d = null;
  if (v) {
    const pr = v.lat != null ? project(pts, v.lat, v.lon, now) : null;
    if (pr) prog = pr.p;
    d = v.delaySec != null ? v.delaySec : pr ? Math.round((v.posTime - pr.schedAt) / 1000) : null;
    if (d != null && prog === 0 && d < 0) d = 0; // autobus czeka na pierwszym przystanku: nie może być "przed czasem"
  }
  const rows = pts.map((p, i) => {
    const exp = d != null ? p.ms + d * 1000 : null;
    const passed = !!v && (prog != null ? i <= prog : exp != null && exp < now - 30000);
    return { i, a: p.a, ms: p.ms, exp, passed };
  });
  const status = v && d != null ? (d > 120 ? "bad" : d > 60 || d < -60 ? "warn" : "ok") : "idle";
  return { rows, runs, inWindow, v, d, prog, status, first, nextIdx: v ? rows.findIndex(r => !r.passed) : -1 };
}
function verdict(row, A) {
  const L = t();
  if (!A.runs) return { cls: "idle", text: L.notToday };
  if (!A.inWindow) return { cls: "idle", text: L.notRunning };
  if (!A.v) return { cls: "idle", text: L.noBus };
  if (A.d == null) return { cls: "idle", text: L.noDelay };
  if (row.passed) return { cls: "idle", text: L.passed };
  const m = Math.round(A.d / 60);
  if (A.d > 60) return { cls: A.d > 120 ? "bad" : "warn", text: L.late(m) };
  if (A.d < -60) return { cls: "warn", text: L.early(Math.abs(m)) };
  return { cls: "ok", text: L.onTime };
}

/* ---- wybór usługi / przystanku / kursu ---- */
function renderServiceSelect() {
  const L = t(), q = $("svcQ").value.trim().toLowerCase();
  const match = s => !q || (s.line + " " + (s.description || "") + " " + (s.operator.name || "")).toLowerCase().includes(q);
  const opt = s => `<option value="${s.id}"${S.svc && s.id === S.svc.id ? " selected" : ""}>${s.line} · ${s.operator.name || ""}${s.kind === "school" ? " · " + L.schoolTag : ""}</option>`;
  const school = S.services.filter(s => s.kind === "school" && match(s)), reg = S.services.filter(s => s.kind !== "school" && match(s));
  $("svcSel").innerHTML = (school.length && reg.length)
    ? `<optgroup label="${L.school}">${school.map(opt).join("")}</optgroup><optgroup label="${L.regular}">${reg.map(opt).join("")}</optgroup>`
    : school.concat(reg).map(opt).join("");
  $("svcQ").hidden = S.services.length < 8; $("svcQ").placeholder = L.search;
}
function renderStopSelect() {
  const L = t(), groups = new Map();
  S.svc.trips.forEach(tr => {
    const key = tr.dest || tr.direction || "";
    if (!groups.has(key)) groups.set(key, new Map());
    tr.stops.forEach(([a, tm]) => { const g = groups.get(key); if (!g.has(a)) g.set(a, []); g.get(a).push(tm); });
  });
  let html = `<option value="">${L.pickPh}</option>`;
  groups.forEach((stops, dest) => {
    html += `<optgroup label="→ ${dest}">` + [...stops].map(([a, times]) =>
      `<option value="${a}"${a === S.stop ? " selected" : ""}>${times.length === 1 ? times[0] + " · " : ""}${stopName(a)}</option>`).join("") + `</optgroup>`;
  });
  $("stopSel").innerHTML = html;
}
function chooseTrip(keepId) {
  const L = t(); $("runField").hidden = true;
  if (!S.stop) { S.tripId = null; return; }
  const cands = S.svc.trips.filter(tr => tr.stops.some(([a]) => a === S.stop));
  const now = Date.now();
  const at = tr => schedMs(tr.stops.find(([a]) => a === S.stop)[1], now);
  let pick = cands.find(tr => tr.id === keepId);
  if (!pick) pick = cands.find(tr => at(tr) + 20 * 60000 >= now) || cands[cands.length - 1];
  S.tripId = pick ? pick.id : null;
  if (cands.length > 1) {
    $("runField").hidden = false; $("runLabel").textContent = L.run;
    $("runSel").innerHTML = cands.map(tr => `<option value="${tr.id}"${tr.id === S.tripId ? " selected" : ""}>${hhmm(at(tr))} → ${tr.dest}</option>`).join("");
  }
}
function setService(id, fresh) {
  S.svc = S.services.find(s => s.id === id) || S.services[0];
  if (fresh) store.set("gb:svc", S.svc.id);
  const saved = store.get("gb:stop:" + S.svc.id);
  const known = S.svc.trips.some(tr => tr.stops.some(([a]) => a === saved));
  S.stop = known ? saved : (demoMode && S.svc.stops["43000632501"] ? "43000632501" : null);
  S.vehicles = []; S.demoT0 = Date.now();
  renderServiceSelect(); renderStopSelect(); chooseTrip(); renderStatic(); renderLive(); poll();
}

/* ---- render ---- */
function renderStatic() {
  const L = t(), tr = trip(), sv = S.svc;
  $("svcLabel").textContent = L.service; $("stopLabel").textContent = L.pick;
  $("num").textContent = sv.line;
  if (tr) { $("dest").textContent = tr.dest; $("via").textContent = `${stopInfo(tr.stops[0][0]).locality} → ${stopInfo(tr.stops[tr.stops.length - 1][0]).locality}`; }
  else { $("dest").textContent = sv.description || ""; $("via").textContent = sv.operator.name || ""; }
  document.documentElement.lang = S.lang;
  $("langBtn").textContent = S.lang === "pl" ? "EN" : "PL";
  $("demo").hidden = !demoMode; $("demo").textContent = L.demo;
  $("source").textContent = L.source;
}
function renderLive() {
  if (!S.svc) return;
  const L = t(), tr = trip();
  if (!tr) {
    $("answer").innerHTML = `<div class="sub">${L.pickHint}</div>`;
    $("route").innerHTML = ""; $("updated").textContent = ""; return;
  }
  const now = nowMs(), A = analyse(now);
  const mine = A.rows.find(r => r.a === S.stop) || A.rows[0];
  const vd = verdict(mine, A);
  const big = mine.exp != null && !mine.passed ? hhmm(mine.exp) : hhmm(mine.ms);
  let html = `<div class="k">${L.willBe}</div>
    <div class="row"><span class="big">${big}</span><span class="chip ${vd.cls}">${vd.text}</span></div>
    <div class="sub">${L.planned} ${hhmm(mine.ms)} · ${stopName(mine.a)}</div>`;
  if (!A.runs) { const n = nextRunText(tr, now); if (n) html += `<div class="sub">${L.nextRun(n)}</div>`; }
  else if (!A.inWindow) html += `<div class="sub">${L.notRunningSub(hhmm(A.first))}</div>`;
  else if (!A.v) html += `<div class="sub">${L.noBusSub}</div>`;
  if (A.v && A.nextIdx >= 0) {
    const n = A.nextIdx, v = A.v;
    const where = n === 0 ? L.atStart(stopName(A.rows[0].a)) : L.between(stopName(A.rows[n - 1].a), stopName(A.rows[n].a));
    const link = v.lat != null ? ` · <a href="https://www.openstreetmap.org/?mlat=${v.lat}&mlon=${v.lon}#map=16/${v.lat}/${v.lon}" target="_blank" rel="noopener">${L.map}</a>` : "";
    html += `<div class="sub"><strong>${L.busNow}</strong> ${where}${link}</div>`;
  }
  $("answer").innerHTML = html;

  let rows = "";
  A.rows.forEach((r, i) => {
    if (A.v && i === A.nextIdx) rows += `<li class="bus"><span class="glyph">▶</span><span>${L.here}</span><span></span></li>`;
    const st = stopInfo(r.a), cls = [r.passed ? "passed" : "", r.a === S.stop ? "mine" : ""].join(" ").trim();
    const late = r.exp != null && !r.passed && Math.abs(r.exp - r.ms) >= 60000;
    const cell = late ? `<s>${hhmm(r.ms)}</s><span class="e ${A.status}">${hhmm(r.exp)}</span>`
      : `<span class="${r.exp != null && !r.passed ? "e ok" : ""}">${hhmm(r.ms)}</span>`;
    rows += `<li class="${cls}"><span class="dot"></span><span class="nm">${st.name}<small>${st.locality}</small></span><span class="times">${cell}</span></li>`;
  });
  $("route").innerHTML = rows;
  if (A.v && A.nextIdx < 0) $("route").insertAdjacentHTML("beforeend", `<li class="bus"><span class="glyph">▶</span><span>${L.here}</span><span></span></li>`);

  let up = "";
  if (S.error) up = L.err;
  else if (A.v && A.v.recorded) {
    const age = Math.max(0, Math.round((Date.now() - A.v.recorded) / 1000));
    up = (Date.now() - A.v.recorded > CONFIG.STALE_MS ? L.stale + " · " : "") + L.updated(age);
  }
  $("updated").textContent = up;
}

/* ---- zdarzenia ---- */
$("svcSel").addEventListener("change", e => setService(e.target.value, true));
$("svcQ").addEventListener("input", renderServiceSelect);
$("stopSel").addEventListener("change", e => {
  S.stop = e.target.value || null; if (S.stop) store.set("gb:stop:" + S.svc.id, S.stop);
  S.demoT0 = Date.now(); chooseTrip(); renderStatic(); renderLive(); poll();
});
$("runSel").addEventListener("change", e => { S.tripId = e.target.value; S.demoT0 = Date.now(); renderStatic(); renderLive(); poll(); });
$("langBtn").addEventListener("click", () => {
  S.lang = S.lang === "pl" ? "en" : "pl"; store.set("gb:lang", S.lang);
  if (S.svc) { renderServiceSelect(); renderStopSelect(); chooseTrip(S.tripId); renderStatic(); renderLive(); }
});

(async function start() {
  try {
    const res = await fetch(CONFIG.SERVICES_URL);
    if (!res.ok) throw new Error(res.status);
    S.services = (await res.json()).services;
    if (!S.services.length) throw new Error("empty");
  } catch (e) {
    $("fail").hidden = false; $("fail").textContent = t().loadErr; return;
  }
  setService(store.get("gb:svc") || S.services[0].id, false);
  setInterval(renderLive, 1000);
  setInterval(poll, demoMode ? 5000 : CONFIG.POLL_MS);
})();
</script>
