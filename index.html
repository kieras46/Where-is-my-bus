<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Is My Bus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Doto:wght@700;900&display=swap">
<style>
/* Layout: one column. Answer for "my stop" first (scheduled + expected time), then the whole route like a bus-stop pole. */
:root {
  color-scheme: light;
  --bg: #f1f3ef;
  --surface: #ffffff;
  --fg: #18201b;
  --muted: #5d685f;
  --line: #d5dad2;
  --accent: #5a2a86;
  --accent-fg: #ffffff;
  --ok: #1d7a3e;
  --ok-bg: #dff1e4;
  --warn: #8a5a00;
  --warn-bg: #fbecc8;
  --bad: #b3261e;
  --bad-bg: #f9dedc;
  --idle: #5d685f;
  --idle-bg: #e4e7e1;
  --blind-bg: #0d0f12;
  --blind-fg: #ffb000;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-blind: "Doto", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181a; --surface: #1d2326; --fg: #e8ede9; --muted: #9aa69d; --line: #2f383b;
    --accent: #c9a2f0; --accent-fg: #1a1024;
    --ok: #6fd391; --ok-bg: #1b3526; --warn: #f0c35a; --warn-bg: #3a2f10;
    --bad: #ff9a92; --bad-bg: #44201d; --idle: #9aa69d; --idle-bg: #2a3235;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181a; --surface: #1d2326; --fg: #e8ede9; --muted: #9aa69d; --line: #2f383b;
  --accent: #c9a2f0; --accent-fg: #1a1024;
  --ok: #6fd391; --ok-bg: #1b3526; --warn: #f0c35a; --warn-bg: #3a2f10;
  --bad: #ff9a92; --bad-bg: #44201d; --idle: #9aa69d; --idle-bg: #2a3235;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.demo { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.fail { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

/* bus destination blind */
.blind { background: var(--blind-bg); color: var(--blind-fg); border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
.blind .num { font-family: var(--font-blind); font-weight: 900; font-size: 56px; line-height: 1; letter-spacing: 2px; }
.blind .dest { font-family: var(--font-blind); font-weight: 700; font-size: 18px; line-height: 1.2; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.blind .via { font-family: var(--font-body); font-size: 13px; color: #c9b27a; margin-top: 4px; text-transform: none; }

.controls { display: grid; gap: 12px; }
label.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
select, input[type="search"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; min-width: 0; }
input[type="search"] { padding-block: 9px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--idle-bg); border-radius: 10px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 10px 8px; border-radius: 7px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }

.answer { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.answer .k { font-size: 14px; color: var(--muted); }
.answer .big { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.answer .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.answer .sub { color: var(--muted); font-size: 15px; }
.answer a { color: var(--accent); font-weight: 700; }
.chip { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.idle { background: var(--idle-bg); color: var(--idle); }

/* two times: scheduled | expected (or actual in History) */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair .cell { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--idle-bg); }
.pair .cell.ok { background: var(--ok-bg); } .pair .cell.warn { background: var(--warn-bg); } .pair .cell.bad { background: var(--bad-bg); }
.pair .lbl { font-size: 13px; color: var(--muted); }
.pair .cell.ok .lbl { color: var(--ok); } .pair .cell.warn .lbl { color: var(--warn); } .pair .cell.bad .lbl { color: var(--bad); }
.pair .big { font-size: 40px; line-height: 1.05; }
.tm.ok { color: var(--ok); } .tm.warn { color: var(--warn); } .tm.bad { color: var(--bad); } .tm.idle { color: var(--muted); }

/* route table: stop | scheduled | expected */
.route { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.route li { display: grid; grid-template-columns: 22px minmax(0, 1fr) 54px 78px; gap: 10px; align-items: center; padding: 10px 14px; position: relative; border-top: 1px solid var(--line); }
.route li:first-child { border-top: 0; }
.route li::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.route li:first-child::before { top: 50%; } .route li:last-child::before { bottom: 50%; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface); margin-left: 2px; position: relative; z-index: 1; }
.route li.passed { color: var(--muted); }
.route li.passed .dot { background: var(--line); border-color: var(--line); }
.route li.mine { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight: 700; }
.route li .nm { overflow-wrap: anywhere; }
.route li .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.route .c { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; display: grid; }
.route .c small { font-size: 12px; font-weight: 400; }
.route .none { color: var(--muted); }
.route .e.ok { color: var(--ok); font-weight: 700; }
.route .e.warn { color: var(--warn); font-weight: 700; }
.route .e.bad { color: var(--bad); font-weight: 700; }
.route li.head { color: var(--muted); font-size: 13px; padding-block: 8px; background: var(--idle-bg); }
.route li.head::before { display: none; }
.route li.bus { grid-template-columns: 22px minmax(0, 1fr); background: var(--accent); color: var(--accent-fg); font-weight: 700; padding-block: 8px; }
.route li.bus::before { display: none; }
.route li.bus .glyph { font-family: var(--font-blind); font-weight: 900; font-size: 18px; }

/* map */
.mapbox { height: min(62vh, 520px); min-height: 320px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; isolation: isolate; background: var(--idle-bg); }
.mapbar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mapbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 700; }
.mapbar button:disabled { opacity: .5; cursor: default; }
.busicon span { display: flex; align-items: center; justify-content: center; width: 44px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-fg);
  border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); font: 900 15px var(--font-body); }
.leaflet-container { font-family: var(--font-body); }

.note { background: var(--idle-bg); border-radius: 8px; padding: 8px 12px; font-size: 14px; color: var(--muted); margin: 0; }
footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
footer .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
footer button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div id="demo" class="demo" hidden></div>
  <div id="fail" class="fail" hidden></div>
  <div class="blind" aria-live="polite">
    <div class="num" id="num">159</div>
    <div class="dest"><span id="dest"></span><div class="via" id="via"></div></div>
  </div>
  <div class="controls">
    <label class="field" id="svcField"><span id="svcLabel"></span>
      <input type="search" id="svcQ" autocomplete="off" hidden>
      <select id="svcSel"></select>
    </label>
    <label class="field"><span id="stopLabel"></span><select id="stopSel"></select></label>
    <label class="field" id="runField" hidden><span id="runLabel"></span><select id="runSel"></select></label>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabLive" aria-selected="true"></button>
    <button type="button" role="tab" id="tabMap" aria-selected="false"></button>
    <button type="button" role="tab" id="tabHist" aria-selected="false"></button>
  </div>

  <div id="livePanel" class="wrap">
    <section class="answer" id="answer" aria-live="polite"></section>
    <ol class="route" id="route"></ol>
  </div>

  <div id="mapPanel" class="wrap" hidden>
    <section class="answer" id="mapInfo" aria-live="polite"></section>
    <div id="mapBox" class="mapbox" role="region" aria-label="Route map"></div>
    <div class="mapbar">
      <button type="button" id="mapRoute"></button>
      <button type="button" id="mapBus"></button>
    </div>
    <p class="note" id="mapNote"></p>
  </div>

  <div id="histPanel" class="wrap" hidden>
    <div class="controls">
      <label class="field" id="hDateField"><span id="hDateLabel"></span><select id="hDate"></select></label>
      <label class="field" id="hTripField"><span id="hTripLabel"></span><select id="hTrip"></select></label>
    </div>
    <section class="answer" id="hSummary" aria-live="polite"></section>
    <ol class="route" id="hRoute"></ol>
    <p class="note" id="hNote"></p>
  </div>

  <footer>
    <div id="updated"></div>
    <div class="bar"><span id="source"></span><button id="langBtn" type="button">PL</button></div>
  </footer>
</div>

<script>
/* ============ SETTINGS ============
   API_BASE: address of your Cloudflare Worker. Empty = demo mode (simulated bus).
   Timetables: services.json next to this page, made with tools/txc_to_json.py from BODS files. */
const CONFIG = { API_BASE: "https://schoolbus.jakubspringer32.workers.dev", SERVICES_URL: "services.json", POLL_MS: 20000, STALE_MS: 150000 };
const LEAFLET = { css: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css", js: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" };
const TILES = { url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' };

const I18N = {
  en: {
    demo: "DEMO MODE: this is a simulation, not a real bus.",
    service: "Service", search: "Search services (number or name)…", school: "School", regular: "Regular", schoolTag: "school",
    pick: "Your stop", pickPh: "Choose a stop…", run: "Trip (time at this stop)",
    lblSched: "Scheduled", lblExp: "Expected", lblActual: "Actual", pickHint: "Choose your stop to see when the bus arrives.",
    onTime: "On time", late: n => `${n} min late`, early: n => `${n} min early`, passed: "Already passed", onTimeShort: "on time",
    noBus: "Bus not visible in the system", noBusSub: "It may not have left yet, or the trip is not running today. Check again shortly.",
    noDelay: "Position unknown, delay not reported", notRunning: "No trip running now", notRunningSub: n => `First stop of this trip: ${n}.`,
    notToday: "This trip does not run today", nextRun: d => `Next runs: ${d}.`,
    busNow: "Bus is now", between: (a, b) => `between: ${a} → ${b}`, atStart: s => `before: ${s}`, map: "View on map", osm: "Open in OpenStreetMap",
    here: "BUS", updated: s => `Data ${s} s old`, stale: "No fresh data from the bus", err: "Could not load data. Try again.",
    source: "Data: Bus Open Data Service (DfT).", loadErr: "Could not load timetables (services.json).", dateLoc: "en-GB",
    live: "Live", tabMap: "Map", history: "History", histDate: "Day", histTrip: "Trip",
    histNoDays: "No trips recorded yet. Recording starts with the next school run.", histNoTrips: "No recorded trips for this day.",
    histLoading: "Loading…", histErr: "Could not load history. Try again.", histDemo: "History is not available in demo mode.",
    histNote: "Actual times are estimated from GPS positions recorded about once a minute, so they can be a minute or so off.",
    colStop: "Stop", colSched: "Sched.", colExp: "Expected", colActual: "Actual", yourStop: "Your stop",
    reached: (n, t) => `Reached ${n} at ${t}`, notRecorded: "Your stop was not recorded on this trip.", dash: "–", vehicle: id => `Vehicle ${id}`, more: n => `+${n} more bus${n > 1 ? "es" : ""} on this run`,
    mapRoute: "Whole route", mapBus: "Find the bus", mapPick: "Choose your stop to see the route on the map.",
    mapErr: "The map could not be loaded. Check your connection and try again.",
    mapNote: "Purple line: bus route. Dots: stops (grey = already passed). Map © OpenStreetMap contributors."
  },
  pl: {
    demo: "TRYB POKAZOWY: to symulacja, nie prawdziwy autobus.",
    service: "Linia", search: "Szukaj linii (numer lub nazwa)…", school: "Szkolne", regular: "Zwykłe", schoolTag: "szkolny",
    pick: "Twój przystanek", pickPh: "Wybierz przystanek…", run: "Kurs (godzina na tym przystanku)",
    lblSched: "Planowy", lblExp: "Oczekiwany", lblActual: "Rzeczywisty", pickHint: "Wybierz swój przystanek, a pokażę, kiedy przyjedzie autobus.",
    onTime: "Na czas", late: n => `Spóźnienie ${n} min`, early: n => `Przed czasem ${n} min`, passed: "Już przejechał", onTimeShort: "na czas",
    noBus: "Autobusu nie widać w systemie", noBusSub: "Może jeszcze nie wyjechał albo kurs dziś nie jedzie. Sprawdź ponownie za chwilę.",
    noDelay: "Pozycja nieznana, brak danych o opóźnieniu", notRunning: "Teraz nie ma kursu", notRunningSub: n => `Pierwszy przystanek tego kursu: ${n}.`,
    notToday: "Dziś ten kurs nie jedzie", nextRun: d => `Następny raz: ${d}.`,
    busNow: "Autobus jest teraz", between: (a, b) => `między: ${a} → ${b}`, atStart: s => `przed przystankiem: ${s}`, map: "Zobacz na mapie", osm: "Otwórz w OpenStreetMap",
    here: "AUTOBUS", updated: s => `Dane sprzed ${s} s`, stale: "Brak świeżych danych z autobusu", err: "Nie można pobrać danych. Spróbuj ponownie.",
    source: "Dane: Bus Open Data Service (DfT).", loadErr: "Nie można wczytać rozkładów (services.json).", dateLoc: "pl-PL",
    live: "Na żywo", tabMap: "Mapa", history: "Historia", histDate: "Dzień", histTrip: "Kurs",
    histNoDays: "Brak zapisanych kursów. Zapis zaczyna się od następnego kursu szkolnego.", histNoTrips: "Brak zapisanych kursów tego dnia.",
    histLoading: "Ładowanie…", histErr: "Nie można pobrać historii. Spróbuj ponownie.", histDemo: "Historia nie jest dostępna w trybie pokazowym.",
    histNote: "Rzeczywiste godziny są szacowane z pozycji GPS zapisywanych mniej więcej raz na minutę, więc mogą się różnić o minutę.",
    colStop: "Przystanek", colSched: "Plan", colExp: "Oczek.", colActual: "Fakt", yourStop: "Twój przystanek",
    reached: (n, t) => `Dojechał do: ${n} o ${t}`, notRecorded: "Nie zarejestrowano Twojego przystanku w tym kursie.", dash: "–", vehicle: id => `Pojazd ${id}`, more: n => `+${n} ${n === 1 ? "autobus" : "autobusy"} więcej na tym kursie`,
    mapRoute: "Cała trasa", mapBus: "Znajdź autobus", mapPick: "Wybierz swój przystanek, aby zobaczyć trasę na mapie.",
    mapErr: "Nie można wczytać mapy. Sprawdź połączenie i spróbuj ponownie.",
    mapNote: "Fioletowa linia: trasa autobusu. Kropki: przystanki (szare = już minięte). Mapa © współtwórcy OpenStreetMap."
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const demoMode = !CONFIG.API_BASE;
const S = { lang: store.get("gb:lang") === "pl" ? "pl" : "en", mode: "live", services: [], svc: null, stop: null, tripId: null, vehicles: [], fetchedAt: null, error: false, demoT0: Date.now() };
const HIST = { svcId: null, days: [], date: null, trips: [], sel: null, state: "idle", err: "" }; // state: idle | loading | ok | err
const MAP = { ready: null, map: null, group: null, key: "", stops: [], userIdx: -1, bus: null, bounds: null };
const t = () => I18N[S.lang];
const trip = () => S.svc && S.svc.trips.find(x => x.id === S.tripId) || null;
const stopInfo = code => S.svc.stops[code] || { name: code, locality: "" };
const stopName = code => { const s = stopInfo(code); return esc((s.locality ? s.locality + " – " : "") + s.name); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---- time ---- */
const hhmm = ms => new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const londonHHMM = ms => new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" });
function schedMs(str, baseMs) { const [h, m] = str.split(":").map(Number); const d = new Date(baseMs); d.setHours(h, m, 0, 0); return d.getTime(); }
const ymd = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function nowMs() {
  const tr = trip();
  if (!demoMode || !tr) return Date.now();
  const st = tr.stops, a = schedMs(st[0][1], Date.now()) - 120000, b = schedMs(st[st.length - 1][1], Date.now()) + 120000;
  return a + (((Date.now() - S.demoT0) * 15) % (b - a)); // 15x faster, looping
}
function runsOn(tr, ms) {
  if (demoMode) return true;
  const wd = new Date(ms).getDay() || 7, day = ymd(ms), svc = S.svc;
  if (!tr.days.includes(wd)) return false;
  if (svc.validFrom && day < svc.validFrom) return false;
  if (svc.validTo && day > svc.validTo) return false;
  if (tr.schoolDays && tr.schoolDays.length)
    return tr.schoolDays.some(ref => ((svc.orgs[ref] || {}).workingDays || []).some(([a, b]) => day >= a && day <= b));
  return true;
}
function nextRunText(tr, ms) {
  for (let i = 1; i <= 120; i++) if (runsOn(tr, ms + i * 86400000))
    return new Date(ms + i * 86400000).toLocaleDateString(t().dateLoc, { weekday: "long", day: "numeric", month: "long" });
  return null;
}

/* ---- position along the route ---- */
function project(pts, lat, lon, now, win = 25) {
  const k0 = Math.cos(lat * Math.PI / 180);
  const X = p => [(p.lon - lon) * k0 * 111320, (p.lat - lat) * 110540];
  let best = null;
  for (let i = 0; i < pts.length - 1; i++) {
    if (now < pts[i].ms - win * 60000 || now > pts[i + 1].ms + win * 60000) continue;
    const A = X(pts[i]), B = X(pts[i + 1]), dx = B[0] - A[0], dy = B[1] - A[1], l2 = dx * dx + dy * dy;
    const f = l2 ? Math.max(0, Math.min(1, -(A[0] * dx + A[1] * dy) / l2)) : 0;
    const dist = Math.hypot(A[0] + f * dx, A[1] + f * dy);
    if (!best || dist < best.dist) best = { i, f, dist };
  }
  if (!best || best.dist > 600) return null;
  const a = pts[best.i], b = pts[best.i + 1];
  return { p: best.i + best.f, schedAt: a.ms + best.f * (b.ms - a.ms), dist: best.dist };
}

/* ---- live data ---- */
function pickVehicles(tr, now) {
  const first = schedMs(tr.stops[0][1], now), o = tr.stops[0][0], d = tr.stops[tr.stops.length - 1][0];
  const score = v => (v.originRef && v.originRef === o ? 1 : 0) + (v.destinationRef && v.destinationRef === d ? 1 : 0);
  const ok = S.vehicles.filter(v => v.recorded && Date.now() - v.recorded < 600000 &&
    (!v.aimedDeparture || Math.abs(v.aimedDeparture - first) < 12 * 60000));
  const best = Math.max(0, ...ok.map(score));
  return ok.filter(v => score(v) === best).sort((a, b) => b.recorded - a.recorded);
}
function demoVehicles() {
  const tr = trip(); if (!tr) return [];
  const now = nowMs(), d = Math.round(170 + 50 * Math.sin(now / 240000)) * 1000;

/* ---- history: when did the bus really pass each stop ---- */
function segLen(a, b) { const k = Math.cos(a.lat * Math.PI / 180); return Math.hypot((b.lon - a.lon) * k * 111320, (b.lat - a.lat) * 110540); }

}

  let Lf;
  try { Lf = await loadLeaflet(); }
  catch (e) { info.innerHTML = `<div class="sub">${L.mapErr}</div>`; return; }
  if (S.mode !== "map" || trip() !== tr) return;      // the person moved on while the map library was loading
  if (!MAP.map) {
    MAP.map = Lf.map("mapBox", { zoomControl: true });
    Lf.tileLayer(TILES.url, { maxZoom: 19, attribution: TILES.attribution }).addTo(MAP.map);
    MAP.group = Lf.layerGroup().addTo(MAP.map);
    MAP.map.setView([52.6, -1.95], 12);
  }
  MAP.map.invalidateSize();

  const now = nowMs(), A = analyse(now);
  info.innerHTML = answerHtml(A, tr, now, true);

  const key = S.svc.id + "|" + tr.id + "|" + S.stop;
  if (MAP.key !== key) {                               // draw the route once per trip / stop
    MAP.key = key; MAP.group.clearLayers(); MAP.stops = []; MAP.bus = null; MAP.others = []; MAP.userIdx = -1;
    const pts = tr.stops.map(([a]) => [stopInfo(a).lat, stopInfo(a).lon]);
    const path = tr.shape && tr.shape.length > 1 ? tr.shape : pts;
    const poly = Lf.polyline(path, { color: css("--accent"), weight: 5, opacity: .85, lineJoin: "round" }).addTo(MAP.group);
    MAP.bounds = poly.getBounds();
    tr.stops.forEach(([a, tm], i) => {
      if (stopInfo(a).lat == null) return;
      const mine = a === S.stop, tip = `${tm} · ${stopName(a)}`;
      const m = mine
        ? Lf.circleMarker(pts[i], { radius: 9, weight: 3, color: "#fff", fillColor: css("--accent"), fillOpacity: 1 }).bindTooltip(`${L.yourStop}: ${stopName(a)}`, { permanent: true, direction: "top", offset: [0, -8] })
        : Lf.circleMarker(pts[i], stopStyle(false)).bindTooltip(tip);
      m.addTo(MAP.group);
      if (mine) MAP.userIdx = i; else MAP.stops.push([m, i]);
    });
    MAP.map.fitBounds(MAP.bounds, { padding: [20, 20] });
  }
  MAP.stops.forEach(([m, i]) => m.setStyle(stopStyle(!!A.rows[i].passed)));

  if (A.v && A.v.lat != null) {                        // bus marker
    const ll = [A.v.lat, A.v.lon];
    const tip = (A.v.id && A.v.id !== "DEMO" ? esc(L.vehicle(A.v.id)) : L.here) + (A.d != null ? " · " + delayText(A.d) : "");
    if (!MAP.bus) {
      MAP.bus = Lf.marker(ll, { icon: Lf.divIcon({ className: "busicon", html: `<span>${esc(S.svc.line)}</span>`, iconSize: [44, 28], iconAnchor: [22, 14] }), zIndexOffset: 1000, keyboard: false })
        .addTo(MAP.group).bindTooltip(tip, { direction: "top", offset: [0, -14] });
    } else { MAP.bus.setLatLng(ll); MAP.bus.setTooltipContent(tip); }
  } else if (MAP.bus) { MAP.group.removeLayer(MAP.bus); MAP.bus = null; }
  (MAP.others || []).forEach(m => MAP.group.removeLayer(m)); MAP.others = [];
  (A.others || []).forEach(o => {                       // other buses on the same run
    if (o.lat == null) return;
    MAP.others.push(Lf.circleMarker([o.lat, o.lon], { radius: 7, weight: 2, color: "#fff", fillColor: "#888", fillOpacity: .95 })
      .addTo(MAP.group).bindTooltip(o.id ? esc(L.vehicle(o.id)) : ""));
  });
  $("mapBus").disabled = !MAP.bus;
}

/* ---- events ---- */
$("svcSel").addEventListener("change", e => setService(e.target.value, true));
$("svcQ").addEventListener("input", renderServiceSelect);
$("stopSel").addEventListener("change", e => {
  S.stop = e.target.value || null; if (S.stop) store.set("gb:stop:" + S.svc.id, S.stop);
  S.demoT0 = Date.now(); chooseTrip(); renderStatic(); renderLive(); poll();
  histPickTrip(false); if (S.mode === "hist") renderHistory();
  if (S.mode === "map") renderMap();
});
$("runSel").addEventListener("change", e => { S.tripId = e.target.value; S.demoT0 = Date.now(); renderStatic(); renderLive(); poll(); if (S.mode === "map") renderMap(); });
$("tabLive").addEventListener("click", () => setMode("live"));
$("tabMap").addEventListener("click", () => setMode("map"));
$("tabHist").addEventListener("click", () => setMode("hist"));
$("answer").addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); setMode(a.dataset.go); } });
$("mapRoute").addEventListener("click", () => { if (MAP.map && MAP.bounds) MAP.map.fitBounds(MAP.bounds, { padding: [20, 20] }); });
$("mapBus").addEventListener("click", () => { if (MAP.map && MAP.bus) MAP.map.setView(MAP.bus.getLatLng(), Math.max(MAP.map.getZoom(), 15)); });
$("hDate").addEventListener("change", e => { HIST.date = e.target.value; histLoadDay(); });
$("hTrip").addEventListener("change", e => { HIST.sel = +e.target.value; renderHistory(); });
$("langBtn").addEventListener("click", () => {
  S.lang = S.lang === "pl" ? "en" : "pl"; store.set("gb:lang", S.lang);
  if (S.svc) { renderServiceSelect(); renderStopSelect(); chooseTrip(S.tripId); renderStatic(); renderLive(); renderHistory(); if (S.mode === "map") { MAP.key = ""; renderMap(); } }
});

(async function start() {
  try {
    const res = await fetch(CONFIG.SERVICES_URL);
    if (!res.ok) throw new Error(res.status);
    S.services = (await res.json()).services;
    if (!S.services.length) throw new Error("empty");
  } catch (e) {
    $("fail").hidden = false; $("fail").textContent = t().loadErr; return;
  }
  setMode("live");
  setService(store.get("gb:svc") || S.services[0].id, false);
  setInterval(renderLive, 1000);
  setInterval(poll, demoMode ? 5000 : CONFIG.POLL_MS);
})();
</script>
</body>
